# Model 1: unet_scratch. Comparison: 1 vs 2: architecture held fixed, no pretraining
run_name: unet_scratch
seed: 0
model:
  name: unet_scratch
  base: 32
data:
  root: data/oxford-iiit-pet
  image_size: 256
  boundary_mode: ignore
  val_fraction: 0.1
  split_seed: 0
  grayscale_p: 0.0
  num_workers: 4
train:
  epochs: 30
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  warmup_epochs: 1
  amp: true
  grad_clip: 1.0
loss:
  dice_weight: 1.0
  bce_weight: 1.0
log:
  backend: tensorboard
  runs_dir: runs
  viz_every: 2
  n_viz: 8
